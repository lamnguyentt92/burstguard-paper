# X3 - triggers outside BurstGuard's search window (RQ3, adaptive attacker). E6 showed that a burst placed 12 slots
# before the end of the context (outside the default window of the last width_max = 6 slots) partly evades the
# screen. Defender's answer: a wider window (width_max = 18 covers offsets up to 15 for 3-slot bursts). Measured:
# detection and residual backdoor for offset 0 / 12, model replacement (boost n/m) and covert (boost 3), and the
# false-positive rate / clean accuracy of the wider window. Head: 3 seeds; LoRA: seed 0 (clean + covert offset 12).
[grid]
name = "X3_trigger_offset"
base_config = "configs/base.toml"
seeds = [0, 1, 2]

[fixed]
"defense.name" = "burstguard"

[factors]
"train.peft" = ["head", "lora"]
"attack.type" = ["none", "scale"]
"attack.boost" = [0.0, 3.0]          # 0 = n/m (model replacement), 3 = covert
"trigger.offset" = [0, 12]           # slots between the end of the burst and the end of the context
"burstguard.width_max" = [6, 18]

[[exclude]]
"attack.type" = "none"
"attack.boost" = 3.0
[[exclude]]                 # without an attack the trigger offset only changes the evaluation windows
"attack.type" = "none"
"trigger.offset" = 12
[[exclude]]                 # LoRA: seed 0, clean runs and the covert attacker at offset 12 only
"train.peft" = "lora"
"run.seed" = 1
[[exclude]]
"train.peft" = "lora"
"run.seed" = 2
[[exclude]]
"train.peft" = "lora"
"attack.boost" = 0.0
"attack.type" = "scale"
[[exclude]]
"train.peft" = "lora"
"attack.type" = "scale"
"trigger.offset" = 0

[analysis]
split = "test"
